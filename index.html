<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kishimba Teachers Portal</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    margin: 0;
    padding: 0;
}
.container {
    max-width: 420px;
    margin: 70px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #ccc;
}
h2 {
    text-align: center;
    color: #123b65;
}
p {
    text-align: center;
    color: #555;
}
input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
}
button {
    width: 100%;
    padding: 12px;
    background: #123b65;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
}
</style>
</head>
<body>

<div class="container">
<h2>KISHIMBA SECONDARY SCHOOL</h2>
<p>Teachers Resource Management System</p>

<form>
<input type="email" placeholder="Email Address" required>
<input type="password" placeholder="Password" required>
<button type="button">Login</button>
</form>

<p>Academic Office & School Administration</p>
</div>

</body>
</html>
