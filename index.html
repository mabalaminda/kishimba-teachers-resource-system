<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kishimba Teachers Portal</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f7;
  margin: 0;
  padding: 30px 15px;
}
.container {
  max-width: 420px;
  margin: 50px auto;
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 4px 15px #ccc;
}
h2 {
  text-align: center;
  color: #123b65;
}
p { text-align: center; color: #555; }
input {
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 6px;
}
button {
  width: 100%;
  padding: 13px;
  background: #123b65;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
}
#message {
  margin-top: 15px;
  color: #b42318;
  overflow-wrap: anywhere;
}
#dashboard { display: none; }
</style>
</head>
<body>

<div class="container">
  <h2>KISHIMBA SECONDARY SCHOOL</h2>
  <p>Teachers Resource Management System</p>

  <div id="login">
    <form id="loginForm">
      <input id="email" type="email"
        placeholder="Email Address" required>

      <input id="password" type="password"
        placeholder="Password" required>

      <button type="submit" id="loginButton">
        Login
      </button>
    </form>
  </div>

  <div id="dashboard">
    <h3>Welcome to Kishimba Teachers Portal</h3>
    <p id="userEmail"></p>
    <p>You have successfully logged in.</p>
    <button id="logoutButton">Logout</button>
  </div>

  <p id="message"></p>
</div>

<script type="module">
import { createClient }
from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://dvgzvgnazghvowyeeapz.supabase.co/rest/v1/;
const SUPABASE_KEY = 'sb_publishable_XqfdqKhVJ3XsWNMWgl6Ytg_ypaRLn-u;

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const loginForm = document.getElementById('loginForm');
const message = document.getElementById('message');

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  message.textContent = 'Please wait...';

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message.textContent = 'Login failed: ' + error.message;
    return;
  }

  showDashboard(data.user);
});

function showDashboard(user) {
  document.getElementById('login').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('userEmail').textContent = user.email;
  message.textContent = '';
}

document.getElementById('logoutButton')
.addEventListener('click', async () => {
  await supabase.auth.signOut();
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login').style.display = 'block';
  loginForm.reset();
});

const { data: sessionData } = await supabase.auth.getSession();

if (sessionData.session) {
  showDashboard(sessionData.session.user);
}
</script>

</body>
</html>
