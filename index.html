
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kishimba Secondary School Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  margin: 0;
  color: #1e293b;
}
header {
  background: #075985;
  color: white;
  padding: 20px;
  text-align: center;
}
main {
  max-width: 650px;
  margin: 25px auto;
  padding: 20px;
}
.card {
  background: white;
  padding: 22px;
  margin-bottom: 18px;
  border-radius: 12px;
  box-shadow: 0 2px 8px #0001;
}
input, select, button {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
}
button {
  background: #075985;
  color: white;
  border: none;
  cursor: pointer;
}
.hidden { display: none; }
.notice { padding: 10px; background: #e0f2fe; }
</style>
</head>
<body>

<header>
<h2>KISHIMBA SECONDARY SCHOOL</h2>
<p>Teachers Resource Management System</p>
</header>

<main>

<section id="login" class="card">
<h3>Teacher / Admin Login</h3>
<input id="email" type="email" placeholder="Email Address">
<input id="password" type="password" placeholder="Password">
<button onclick="loginUser()">Login</button>
<p id="loginMessage"></p>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h3>Welcome to Kishimba Teachers Portal</h3>
<p id="userName"></p>
<p id="userRole"></p>
<button onclick="logoutUser()">Logout</button>
</div>

<div class="card">
<h3>Upload Teaching Materials</h3>

<input id="title" placeholder="Material Title">

<select id="materialType">
<option value="">Select Material Type</option>
<option>Scheme of Work</option>
<option>Lesson Plan</option>
<option>Lesson Notes</option>
<option>Notices</option>
<option>Tests and Exams</option>
<option>Question Bank</option>
<option>Teaching Resources</option>
</select>
<label for="subject">Subject</label>
<input id="subject" placeholder="Subject" required>

<label for="className">Select Class</label>
<select id="className" required>
  <option value="">Select Class</option>
  <option>Form One</option>
  <option>Form Two</option>
  <option>Form Three</option>
  <option>Form Four</option>
  <option>Form Five</option>
  <option>Form Six</option>
</select>


<input id="academicYear" type="number" placeholder="Academic Year">
<input id="file" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.mp4">

<button onclick="uploadMaterial()">Upload Material</button>
<p id="uploadMessage"></p>
</div>

<div class="card">
<h3>My Uploaded Materials</h3>
<div id="materialsList">Loading...</div>
</div>
  <div class="card" id="adminDashboard" style="display:none;">
  <h3>Administrator Dashboard</h3>

  <h4>Registered Teachers</h4>
  <div id="teachersList">Loading teachers...</div>

  <h4>All Teaching Materials</h4>
  <div id="allMaterialsList">Loading materials...</div>
</div>

</section>
</main>

<script>
const SUPABASE_URL = "https://dvgzvgnazghvowyeeapz.supabase.co";
const SUPABASE_KEY = "sb_publishable_XqfdqKhVJ3XsWNMWgl6Ytg_ypaRLn-u";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let currentTeacher = null;

async function loginUser() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("loginMessage");

  message.textContent = "Logging in...";

  const { data, error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message.textContent = error.message;
    return;
  }

  await showDashboard(data.user);
}

async function showDashboard(user) {
  currentUser = user;

  const { data: profile, error } = await db
    .from("teachers")
    .select("*")
    .eq("id", user.id)
    .maybeSingle();

  if (error || !profile) {
    document.getElementById("loginMessage").textContent =
      "Profile not found. Contact the school administrator.";
    await db.auth.signOut();
    return;
  }

  currentTeacher = profile;

  document.getElementById("login").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");

  document.getElementById("userName").textContent =
    "Name: " + profile.full_name;

  document.getElementById("userRole").textContent =
    "Role: " + profile.role;
  if (profile.role === "admin") {
  document.getElementById("adminDashboard").style.display = "block";
} else {
  document.getElementById("adminDashboard").style.display = "none";
}

  await loadMaterials();
}

async function uploadMaterial() {
  
const message = document.getElementById("uploadMessage");
  const file = document.getElementById("file").files[0];

  if (!file || !currentTeacher) {
    message.textContent = "Please select a file.";
    return;
  }
  const title = document.getElementById("title").value.trim();
  const type = document.getElementById("materialType").value;
  const subject = document.getElementById("subject").value.trim();
  const className = document.getElementById("className").value;
  const year = document.getElementById("academicYear").value;

  if (!title || !type || !subject || !className || !year) {
    message.textContent = "Please complete all fields.";
    return;
  }

  if (file.size > 20 * 1024 * 1024) {
    message.textContent = "File must not exceed 20 MB.";
    return;
  }

  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const filePath = currentUser.id + "/" +
    Date.now() + "_" + safeName;

  message.textContent = "Uploading...";

  const { error: storageError } = await db.storage
    .from("teaching-materials")
    .upload(filePath, file);

  if (storageError) {
    message.textContent = storageError.message;
    return;
  }

  const { error: insertError } = await db
    .from("teaching_materials")
    .insert({
      teacher_id: currentUser.id,
      title: title,
      material_type: type,
      subject: subject,
      class_name: className,
      academic_year: Number(year),
      file_path: filePath,
      review_status: "Pending"
    });

  if (insertError) {
    message.textContent =
      "Database error: " + insertError.message;
    return;
  }

  message.textContent = "Upload successful!";
  document.getElementById("title").value = "";
  document.getElementById("subject").value = "";
  document.getElementById("file").value = "";

  await loadMaterials();

  async function loadMaterials() {
  const list = document.getElementById("materialsList");

  list.innerHTML = "Loading materials...";

  const { data, error } = await db
    .from("teaching_materials")
    .select("title, material_type, subject, class_name, review_status, created_at")
    .order("created_at", { ascending: false });

  if (error) {
    list.innerHTML = "Error: " + error.message;
    return;
  }

  list.innerHTML = "";

  if (!data || data.length === 0) {
    list.innerHTML = "No teaching materials found.";
    return;
  }

  data.forEach(item => {
    const entry = document.createElement("p");

    entry.textContent =
      item.title + " - " +
      item.material_type + " - " +
      item.subject + " - " +
      item.class_name + " - " +
      (item.review_status || "Pending");

    list.appendChild(entry);
  });
}

async function logoutUser() {
  await db.auth.signOut();
  currentUser = null;
  currentTeacher = null;

  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
}

async function restoreSession() {
  const { data } = await db.auth.getSession();

  if (data.session) {
    await showDashboard(data.session.user);
  }
}

restoreSession();
</script>
</body>
</html>
