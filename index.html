
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kishimba Teachers Resource System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  margin: 0;
  padding: 20px;
}
.container {
  max-width: 850px;
  margin: auto;
}
.card {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 8px #00000015;
}
h1, h2, h3 {
  color: #123b63;
}
input, select, button {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  box-sizing: border-box;
}
button {
  background: #12613b;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
button:hover {
  background: #0b472a;
}
.hidden {
  display: none !important;
}
#loginMessage, #uploadMessage {
  color: #b42318;
  overflow-wrap: anywhere;
}
.material {
  background: #eef4f8;
  padding: 12px;
  margin: 8px 0;
  border-radius: 6px;
}
</style>
</head>

<body>
<div class="container">

<h1>Kishimba Secondary School</h1>
<h2>Teachers Resource Management System</h2>

<section id="login" class="card">
  <h3>Teacher / Admin Login</h3>

  <input id="email" type="email" placeholder="Email Address">
  <input id="password" type="password" placeholder="Password">

  <button onclick="loginUser()">Login</button>

  <p id="loginMessage"></p>
</section>

<section id="dashboard" class="hidden">

  <div class="card">
    <h3>Welcome to Kishimba Portal</h3>
    <p id="userName"></p>
    <p id="userRole"></p>
    <button onclick="logoutUser()">Logout</button>
  </div>

  <section id="adminDashboard" class="card hidden">
    <h3>Administrator Dashboard</h3>
    <p>Manage teachers and review teaching materials.</p>
    <h3>Teaching Materials</h3>
    <div id="materialsList"></div>
  </section>

  <section id="teacherDashboard" class="card hidden">
    <h3>Teacher Dashboard</h3>

    <h3>Upload Teaching Materials</h3>

    <input id="title" placeholder="Material Title">

    <select id="materialType">
      <option value="">Select Material Type</option>
      <option>Scheme of Work</option>
      <option>Lesson Plan</option>
      <option>Lesson Notes</option>
      <option>Notices</option>
      <option>Tests and Exams</option>
      <option>Question Bank</option>
      <option>Teaching Resources</option>
    </select>

    <input id="subject" placeholder="Subject">
    <input id="className" placeholder="Class e.g. FORM TWO">
    <input id="academicYear" type="number" placeholder="Academic Year">

    <label>Select File</label>
    <input id="file" type="file">

    <button onclick="uploadMaterial()">Upload Material</button>
    <p id="uploadMessage"></p>

    <h3>Available Teaching Materials</h3>
    <div id="materialsListTeacher"></div>
  </section>

</section>
</div>

<script>
const SUPABASE_URL = "https://dvgzvgnazghvowyeeapz.supabase.co";
const SUPABASE_KEY = "sb_publishable_XqfdqKhVJ3XsWNMWgl6Ytg_ypaRLn-u";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let currentTeacher = null;


// LOGIN
async function loginUser() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("loginMessage");

  message.textContent = "Logging in...";

  try {
    const { data, error } = await db.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      message.textContent = error.message;
      return;
    }

    await showDashboard(data.user);

  } catch (err) {
    message.textContent = "Login error: " + err.message;
  }
}


// SHOW DASHBOARD
async function showDashboard(user) {
  currentUser = user;

  const { data: profile, error } = await db
    .from("teachers")
    .select("*")
    .eq("id", user.id)
    .maybeSingle();

  if (error || !profile) {
    document.getElementById("loginMessage").textContent =
      "Profile not found. Contact the school administrator.";

    await db.auth.signOut();
    currentUser = null;
    return;
  }

  currentTeacher = profile;

  document.getElementById("login").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");

  document.getElementById("userName").textContent =
    "Name: " + (profile.full_name || "");

  document.getElementById("userRole").textContent =
    "Role: " + profile.role;

  if (profile.role === "admin") {
    document.getElementById("adminDashboard").classList.remove("hidden");
    document.getElementById("teacherDashboard").classList.add("hidden");
  } else {
    document.getElementById("teacherDashboard").classList.remove("hidden");
    document.getElementById("adminDashboard").classList.add("hidden");
  }

  await loadMaterials();
}


// UPLOAD MATERIAL
async function uploadMaterial() {
  const message = document.getElementById("uploadMessage");

  const title = document.getElementById("title").value.trim();
  const type = document.getElementById("materialType").value;
  const subject = document.getElementById("subject").value.trim();
  const className = document.getElementById("className").value.trim();
  const year = document.getElementById("academicYear").value;
  const file = document.getElementById("file").files[0];

  if (!currentUser || !currentTeacher) {
    message.textContent = "Please login again.";
    return;
  }

  if (!title || !type || !subject || !className || !year || !file) {
    message.textContent = "Please fill all fields and select a file.";
    return;
  }

  message.textContent = "Uploading...";

  try {
    const safeFileName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const filePath = currentUser.id + "/" + Date.now() + "_" + safeFileName;

    const { error: storageError } = await db.storage
      .from("teaching-materials")
      .upload(filePath, file);

    if (storageError) {
      message.textContent = storageError.message;
      return;
    }

    const { error: insertError } = await db
      .from("teaching_materials")
      .insert({
        teacher_id: currentUser.id,
        title: title,
        material_type: type,
        subject: subject,
        class_name: className,
        academic_year: Number(year),
        file_path: filePath,
        review_status: "Pending"
      });

    if (insertError) {
      message.textContent = "Database error: " + insertError.message;
      return;
    }

    message.textContent = "Upload successful!";

    document.getElementById("title").value = "";
    document.getElementById("subject").value = "";
    document.getElementById("file").value = "";

    await loadMaterials();

  } catch (err) {
    message.textContent = "Upload error: " + err.message;
  }
}


// LOAD MATERIALS
async function loadMaterials() {
  const adminList = document.getElementById("materialsList");
  const teacherList = document.getElementById("materialsListTeacher");

  if (adminList) adminList.innerHTML = "Loading materials...";
  if (teacherList) teacherList.innerHTML = "Loading materials...";

  const { data, error } = await db
    .from("teaching_materials")
    .select("title, material_type, subject, class_name, review_status, created_at, file_path")
    .order("created_at", { ascending: false });

  if (error) {
    if (adminList) adminList.textContent = "Error: " + error.message;
    if (teacherList) teacherList.textContent = "Error: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    if (adminList) adminList.textContent = "No teaching materials found.";
    if (teacherList) teacherList.textContent = "No teaching materials found.";
    return;
  }

  if (adminList) adminList.innerHTML = "";
  if (teacherList) teacherList.innerHTML = "";

  data.forEach(item => {
    const entry = document.createElement("div");
    entry.className = "material";

    entry.textContent =
      item.title + " - " +
      item.material_type + " - " +
      item.subject + " - " +
      item.class_name + " - " +
      (item.review_status || "Pending");

    if (adminList) adminList.appendChild(entry.cloneNode(true));
    if (teacherList) teacherList.appendChild(entry.cloneNode(true));
  });
}


// LOGOUT
async function logoutUser() {
  await db.auth.signOut();

  currentUser = null;
  currentTeacher = null;

  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("email").value = "";
  document.getElementById("password").value = "";
  document.getElementById("loginMessage").textContent = "";
}


// RESTORE SESSION
async function restoreSession() {
  const { data, error } = await db.auth.getSession();

  if (error) {
    console.error(error.message);
    return;
  }

  if (data.session) {
    await showDashboard(data.session.user);
  }
}

restoreSession();

</script>
</body>
</html>
